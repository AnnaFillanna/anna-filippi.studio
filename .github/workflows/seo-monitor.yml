

name: Anna SEO Monitor

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check Anna Filippi Studio SEO
        run: python3 scripts/seo-monitor.py

      - name: Save SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anna-seo-report
          path: seo-report.md
          retention-days: 30
